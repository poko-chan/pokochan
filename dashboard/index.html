<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード - pokochanのWebサイト</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 400px; margin: 20px auto; }
    .user-icon { width: 80px; height: 80px; border-radius: 50%; }
    button { padding: 10px 20px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>ダッシュボード</h1>

  <div class="card">
    <img id="user-icon" class="user-icon" src="" alt="ユーザーアイコン">
    <h2 id="user-name">読み込み中...</h2>
    <p>Email: <span id="user-email">-</span></p>
    <p>生年月日: <span id="user-birthdate">-</span></p>
    <button id="btn-logout">ログアウト</button>
  </div>
  <div style="margin-top: 20px;">
    <a href="../settings/" style="color: #38bdf8; text-decoration: none; font-weight: bold;">
    ⚙️ 設定
    </a>
  </div>

  <script type="module">
    import { auth, db, doc, getDoc, signOut, onAuthStateChanged } from '../lib/firebase.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // 未ログイン時はログイン画面へ
        window.location.href = '../login/';
        return;
      }

      // Firestoreからプロフィール情報を取得
      const userSnap = await getDoc(doc(db, 'users', user.uid));

      if (!userSnap.exists()) {
        // 生年月日などのプロフィールデータが無い場合は登録画面へ戻す
        window.location.href = '../onboarding/';
        return;
      }

      // 画面に情報をセット
      const userData = userSnap.data();
      document.getElementById('user-name').textContent = user.displayName || 'ゲスト';
      document.getElementById('user-email').textContent = user.email || '非公開';
      document.getElementById('user-icon').src = user.photoURL || '';
      document.getElementById('user-birthdate').textContent = userData.birthdate || '未設定';
    });

    // ログアウト処理
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = '../login/';
    });
  </script>
</body>
</html>
