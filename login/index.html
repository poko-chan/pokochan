<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - pokochanのWebサイト</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <h1>ログイン</h1>

  <div id="login-section">
    <p>ログイン方法を選択してください</p>
    <button id="btn-google">Googleでログイン</button>
    <button id="btn-github">GitHubでログイン</button>
  </div>

  <script type="module">
    import { 
      auth, 
      db, 
      doc, 
      getDoc, 
      googleProvider, 
      githubProvider, 
      signInWithPopup, 
      onAuthStateChanged 
    } from '../lib/firebase.js';

    // ログイン検知と振り分け処理
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Firestoreからユーザープロフィールを確認
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          // プロフィール登録済みならダッシュボードへ
          window.location.href = '../dashboard/';
        } else {
          // 未登録なら質問画面（初期登録）へ
          window.location.href = '../onboarding/';
        }
      }
    });

    // Googleログイン
    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user') {
          alert('Googleログイン失敗: ' + error.message);
        }
      }
    });

    // GitHubログイン
    document.getElementById('btn-github').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, githubProvider);
      } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user') {
          alert('GitHubログイン失敗: ' + error.message);
        }
      }
    });
  </script>
</body>
</html>
