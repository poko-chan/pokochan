<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン / 新規登録 - pokochanのWebサイト</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 2px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
      margin-bottom: -2px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #7dd3fc;
    }
    .form-container {
      display: none;
    }
    .form-container.active {
      display: block;
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">ログイン</button>
      <button class="tab-btn" onclick="switchTab('register')">新規登録</button>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <!-- 1. ログインフォーム -->
    <form id="login-form" class="form-container active">
      <div class="form-group">
        <label for="login-email">メールアドレス</label>
        <input type="email" id="login-email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">パスワード</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">ログイン</button>
    </form>

    <!-- 2. 新規登録フォーム -->
    <form id="register-form" class="form-container">
      <div class="form-group">
        <label for="reg-email">メールアドレス</label>
        <input type="email" id="reg-email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label for="reg-password">パスワード（6文字以上）</label>
        <input type="password" id="reg-password" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" class="btn-submit">アカウント作成して始める</button>
    </form>
  </div>

  <script type="module">
    import { 
      auth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword,
      onAuthStateChanged 
    } from '../lib/firebase.js';

    // 既にログイン済みの場合はダッシュボードへ移動
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = '../dashboard/';
      }
    });

    const errorEl = document.getElementById('error-msg');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    // タブ切り替え処理
    window.switchTab = (tab) => {
      errorEl.style.display = 'none';
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    };

    // ログイン処理
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = '../dashboard/';
      } catch (error) {
        showError('ログインに失敗しました: ' + translateErrorMessage(error.code));
      }
    });

    // 新規登録処理
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        // 新規登録成功時はオンボーディング画面（初期設定）へ移動
        window.location.href = '../onboarding/';
      } catch (error) {
        showError('登録に失敗しました: ' + translateErrorMessage(error.code));
      }
    });

    // Firebaseエラーメッセージを日本語化
    function translateErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use':
          return 'このメールアドレスは既に登録されています。';
        case 'auth/invalid-email':
          return 'メールアドレスの形式が正しくありません。';
        case 'auth/weak-password':
          return 'パスワードは6文字以上で指定してください。';
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found':
          return 'メールアドレスまたはパスワードが正しくありません。';
        default:
          return 'エラーが発生しました。時間をおいて再試行してください。';
      }
    }
  </script>
</body>
</html>
