<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初期設定 - pokochanのWebサイト</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 30px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* プログレスバー */
    .progress-bar {
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 33.3%;
      background: #38bdf8;
      transition: width 0.4s ease;
    }

    /* 質問ステップのスタイルと切り替えアニメーション */
    .step {
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }
    .step.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    h2 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #f8fafc;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }
    button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-next { background: #38bdf8; color: #0f172a; }
    .btn-next:hover { background: #7dd3fc; }
    .btn-back { background: #334155; color: #94a3b8; }
    .btn-back:hover { background: #475569; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <!-- プログレスバー -->
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <!-- Step 1: 名前 -->
    <div id="step-1" class="step active">
      <h2>まずはお名前を教えてください</h2>
      <p class="subtitle">サイト内で表示されるニックネームです</p>
      <input type="text" id="displayName" placeholder="例: ポコちゃん" required>
      <div class="btn-group">
        <button type="button" class="btn-next" onclick="nextStep(1)">次へ</button>
      </div>
    </div>

    <!-- Step 2: 生年月日 -->
    <div id="step-2" class="step">
      <h2>生年月日を教えてください</h2>
      <p class="subtitle">あなたに合わせた情報をお届けします</p>
      <input type="date" id="birthdate" required>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevStep(2)">戻る</button>
        <button type="button" class="btn-next" onclick="nextStep(2)">次へ</button>
      </div>
    </div>

    <!-- Step 3: 性別 -->
    <div id="step-3" class="step">
      <h2>性別を教えてください</h2>
      <p class="subtitle">該当するものをお選びください（スキップ可）</p>
      <select id="gender">
        <option value="未設定">回答しない</option>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
        <option value="その他">その他</option>
      </select>
      <div class="btn-group">
        <button type="button" class="btn-back" onclick="prevStep(3)">戻る</button>
        <button type="button" id="btn-submit" class="btn-next">完了してスタート</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, doc, setDoc, onAuthStateChanged } from '../lib/firebase.js';

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = '../login/';
      } else {
        currentUser = user;
        if (user.displayName && !document.getElementById('displayName').value) {
          document.getElementById('displayName').value = user.displayName;
        }
      }
    });

    // ステップ管理関数をグローバルに登録
    window.nextStep = (current) => {
      if (current === 1 && !document.getElementById('displayName').value.trim()) {
        alert('お名前を入力してください');
        return;
      }
      if (current === 2 && !document.getElementById('birthdate').value) {
        alert('生年月日を選択してください');
        return;
      }

      document.getElementById(`step-${current}`).classList.remove('active');
      const next = current + 1;
      document.getElementById(`step-${next}`).classList.add('active');
      document.getElementById('progress-fill').style.width = `${(next / 3) * 100}%`;
    };

    window.prevStep = (current) => {
      document.getElementById(`step-${current}`).classList.remove('active');
      const prev = current - 1;
      document.getElementById(`step-${prev}`).classList.add('active');
      document.getElementById('progress-fill').style.width = `${(prev / 3) * 100}%`;
    };

    // 最終送信処理
    document.getElementById('btn-submit').addEventListener('click', async () => {
      if (!currentUser) return;

      const displayName = document.getElementById('displayName').value;
      const birthdate = document.getElementById('birthdate').value;
      const gender = document.getElementById('gender').value;

      try {
        await setDoc(doc(db, 'users', currentUser.uid), {
          name: displayName,
          email: currentUser.email,
          photoURL: currentUser.photoURL || '',
          birthdate: birthdate,
          gender: gender,
          createdAt: new Date()
        });

        window.location.href = '../dashboard/';
      } catch (error) {
        alert('保存に失敗しました: ' + error.message);
      }
    });
  </script>
</body>
</html>
