<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール設定 - pokochan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 22px; margin-top: 0; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    .optional-tag { font-size: 12px; color: #64748b; margin-left: 6px; }
    input, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <div class="card">
    <h1>プロフィール登録</h1>
    <p class="sub">アカウントの初期設定を行います。</p>

    <form id="onboarding-form">
      <div class="form-group">
        <label for="displayName">表示名 <span style="color:#f87171">*</span></label>
        <input type="text" id="displayName" placeholder="ぽこちゃん" required>
      </div>

      <div class="form-group">
        <label for="username">ユーザー名 (@ID) <span style="color:#f87171">*</span></label>
        <input type="text" id="username" placeholder="poko_chan" pattern="^[a-zA-Z0-9_]+$" title="半角英数字とアンダースコアのみ" required>
      </div>

      <div class="form-group">
        <label for="gender">性別 <span class="optional-tag">任意</span></label>
        <select id="gender">
          <option value="">選択しない</option>
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="birthdate">誕生日 <span class="optional-tag">任意</span></label>
        <input type="date" id="birthdate">
      </div>

      <button type="submit" class="btn">登録を完了する</button>
    </form>
  </div>

  <script type="module">
    import { auth, db, doc, setDoc, onAuthStateChanged } from '../lib/firebase.js';

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = '../login/';
      } else {
        currentUser = user;
      }
    });

    document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const name = document.getElementById('displayName').value.trim();
      const username = document.getElementById('username').value.trim();
      const gender = document.getElementById('gender').value;
      const birthdate = document.getElementById('birthdate').value;

      try {
        await setDoc(doc(db, 'users', currentUser.uid), {
          uid: currentUser.uid,
          email: currentUser.email,
          name: name,
          username: username,
          gender: gender || null,
          birthdate: birthdate || null,
          createdAt: new Date()
        });

        window.location.href = '../dashboard/';
      } catch (err) {
        alert('保存に失敗しました: ' + err.message);
      }
    });
  </script>
</body>
</html>
